name: Backend CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: .

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      run_backend: ${{ steps.scope.outputs.run_backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Determine affected workspaces
        run: node scripts/ci-affected-workspaces.mjs

  backend:
    needs: affected
    if: needs.affected.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Check staging Compose configuration and deployment artifacts
        run: |
          docker compose --env-file .env.staging.example -f docker-compose.staging.yml config --quiet
          npm run smoke:g10-artifacts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build all workspace projects
        run: npm run build
      - name: Build immutable service images
        run: npm run images:build
      - name: Unit and HTTP end-to-end smoke tests
        run: npm run test:unit && npm run test:g0
      - name: Start core infrastructure and bootstrap twice
        run: |
          cp .env.example .env
          npm run dev:keys
          npm run infra:up
          npm run infra:bootstrap
      - name: Start media infrastructure and verify owned HLS
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          npm run infra:media
          npm run test:e2e
          node scripts/infra-persistence.mjs mark
          sleep 2
          docker compose --profile core restart postgres redis kafka
          docker compose --profile core --profile media up --detach --wait
          node scripts/infra-persistence.mjs verify
          npm run infra:bootstrap
          npm run smoke:g10-images
          npm run smoke:g10-migrations
          npm run smoke:g10-restore
      - name: Stop test infrastructure
        if: always()
        run: if [ -f .env ]; then docker compose --profile core --profile media --profile observability down --volumes --remove-orphans; fi

  publish-images:
    needs: [affected, backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && needs.affected.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api-gateway, target: app-runtime, service: api-gateway }
          - { name: auth-service, target: app-runtime, service: auth-service }
          - { name: profile-service, target: app-runtime, service: profile-service }
          - { name: catalog-service, target: app-runtime, service: catalog-service }
          - { name: payment-service, target: app-runtime, service: payment-service }
          - { name: streaming-service, target: app-runtime, service: streaming-service }
          - { name: transcode-worker, target: worker-runtime, service: transcode-worker }
          - { name: notification-service, target: app-runtime, service: notification-service }
          - { name: recommendation-service, target: app-runtime, service: recommendation-service }
          - { name: media-edge, target: app-runtime, service: media-edge }
          - { name: migrations, target: migrations, service: migrations }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            MOVIEAPP_SERVICE=${{ matrix.service }}
            VCS_REF=${{ github.sha }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/movieapp-${{ matrix.name }}:sha-${{ github.sha }}
