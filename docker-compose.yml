services:
  auth-postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: movieapp
      POSTGRES_PASSWORD: movieapp_dev_only
      POSTGRES_DB: auth_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieapp -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  auth-postgres-data:
